# Nginx configuration for Meeting Transcriber
# Place this in /etc/nginx/sites-available/meeting-transcriber
# Then create symlink: ln -s /etc/nginx/sites-available/meeting-transcriber /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name your-domain.com;  # Replace with your domain or server IP

    # Maximum upload size (500MB for large audio files)
    client_max_body_size 500M;
    client_body_timeout 600s;

    # Logging
    access_log /var/log/nginx/meeting-transcriber.access.log;
    error_log /var/log/nginx/meeting-transcriber.error.log;

    # Main application
    location / {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long-running requests
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        # WebSocket support (for future real-time features)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Health check endpoint (no auth required)
    location /health {
        proxy_pass http://localhost:8080/health;
        access_log off;
    }

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";
}

