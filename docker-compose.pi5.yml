version: '3.8'

# Optimized for Raspberry Pi 5 / 8GB RAM systems
# This configuration balances performance and memory usage

services:
  # Whisper API for transcription
  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest
    container_name: meeting-whisper
    ports:
      - "9000:9000"
    environment:
      - ASR_MODEL=small  # Uses ~2GB RAM, good quality
      - ASR_ENGINE=openai_whisper
    volumes:
      - whisper-cache:/root/.cache
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 3G  # Limit to prevent OOM
        reservations:
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Ollama for LLM analysis
  ollama:
    image: ollama/ollama:latest
    container_name: meeting-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G  # Limit to prevent OOM
        reservations:
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Flask web application
  web:
    build: .
    container_name: meeting-web
    ports:
      - "8080:8080"
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data
    depends_on:
      - whisper
      - ollama
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: ["gunicorn", "--bind", "0.0.0.0:8080", "--workers", "2", "--timeout", "600", "app:app"]

volumes:
  whisper-cache:
  ollama-data:
