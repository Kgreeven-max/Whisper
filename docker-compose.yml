version: '3.8'

services:
  # Whisper API for transcription
  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest
    container_name: meeting-whisper
    ports:
      - "9000:9000"
    environment:
      - ASR_MODEL=${WHISPER_MODEL:-small}  # small is optimized for 8GB RAM
      - ASR_ENGINE=openai_whisper
    volumes:
      - whisper-cache:/root/.cache
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2.5G
        reservations:
          memory: 1.5G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Ollama for LLM analysis
  ollama:
    image: ollama/ollama:latest
    container_name: meeting-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2.5G
        reservations:
          memory: 1.5G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    container_name: meeting-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-meetings}
      - POSTGRES_USER=${POSTGRES_USER:-meeting_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Please set POSTGRES_PASSWORD in .env file}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 384M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-meeting_user} -d ${POSTGRES_DB:-meetings}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Flask web application
  web:
    build: .
    container_name: meeting-web
    ports:
      - "8080:8080"
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://${POSTGRES_USER:-meeting_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-meetings}
      - SECRET_KEY=${SECRET_KEY:?Please set SECRET_KEY in .env file}
      - JWT_SECRET=${JWT_SECRET:-${SECRET_KEY}}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-phi}
      - WHISPER_MODEL=${WHISPER_MODEL:-small}
      - MAX_CONCURRENT_JOBS=${MAX_CONCURRENT_JOBS:-4}
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      - whisper
      - ollama
      - postgres
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1.5G
        reservations:
          memory: 768M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: ["gunicorn", "--bind", "0.0.0.0:8080", "--workers", "4", "--threads", "2", "--timeout", "600", "--worker-class", "gthread", "app:app"]

volumes:
  whisper-cache:
  ollama-data:
  postgres-data:
  uploads-data:
