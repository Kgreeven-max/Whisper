# PostgreSQL Configuration for 8GB RAM VPS with 4 Concurrent Users
# Optimized for fast performance with meeting transcription workload

# Memory Settings
shared_buffers = 256MB                   # 25% of RAM allocated to Postgres (768MB)
effective_cache_size = 512MB             # 50% of RAM allocated to Postgres
work_mem = 8MB                           # Per-operation memory (4 workers * 8MB = 32MB)
maintenance_work_mem = 64MB              # For maintenance operations

# Connection Settings
max_connections = 50                     # 4 workers * 4 threads + pool overhead

# Write-Ahead Log (WAL) Settings - Optimized for performance
wal_buffers = 8MB                        # Improved write performance
checkpoint_completion_target = 0.9       # Spread out checkpoint I/O
checkpoint_timeout = 15min               # Longer checkpoint intervals

# Query Planning
random_page_cost = 1.1                   # SSD optimization (default is 4.0)
effective_io_concurrency = 200           # SSD can handle concurrent I/O

# Logging (for production monitoring)
log_min_duration_statement = 1000        # Log queries longer than 1 second
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
log_timezone = 'UTC'

# Performance
default_statistics_target = 100          # Better query planning

# Autovacuum - Keep database healthy
autovacuum = on
autovacuum_max_workers = 2
autovacuum_naptime = 30s                 # More frequent autovacuum
