<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Meeting Transcriber</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2563eb;
            --primary-dark: #1e40af;
            --danger: #ef4444;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --border: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-container {
            background: var(--card-bg);
            border-radius: 1rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 420px;
            padding: 2.5rem;
        }

        .logo {
            text-align: center;
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        .subtitle {
            text-align: center;
            color: var(--text-light);
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text);
        }

        .form-input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            font-size: 1rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .btn {
            width: 100%;
            padding: 0.875rem;
            border-radius: 0.5rem;
            border: none;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--primary-dark);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .alert {
            padding: 0.875rem;
            border-radius: 0.5rem;
            margin-bottom: 1.5rem;
            display: none;
        }

        .alert.show {
            display: block;
        }

        .alert-error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .alert-success {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }

        .alert-info {
            background: #dbeafe;
            color: #1e40af;
            border: 1px solid #bfdbfe;
        }

        .auth-footer {
            text-align: center;
            margin-top: 1.5rem;
            color: var(--text-light);
        }

        .auth-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .step {
            display: none;
        }

        .step.active {
            display: block;
        }

        .info-box {
            background: var(--bg);
            border-radius: 0.5rem;
            padding: 1rem;
            margin-bottom: 1.5rem;
            font-size: 0.875rem;
            color: var(--text-light);
        }

        .security-question {
            background: var(--bg);
            border-radius: 0.5rem;
            padding: 1rem;
            margin-bottom: 1.5rem;
            font-weight: 600;
            color: var(--text);
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="logo">🔒 Password Reset</div>
        <p class="subtitle">Recover your account</p>

        <div id="alert" class="alert"></div>

        <!-- Step 1: Enter Username -->
        <div id="step1" class="step active">
            <div class="info-box">
                Enter your username and we'll show you your security question.
            </div>

            <form id="username-form">
                <div class="form-group">
                    <label class="form-label">Username</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        class="form-input"
                        placeholder="Enter your username"
                        required
                        autofocus
                    >
                </div>

                <button type="submit" class="btn btn-primary" id="username-btn">
                    Continue
                </button>
            </form>
        </div>

        <!-- Step 2: Answer Security Question -->
        <div id="step2" class="step">
            <div class="info-box">
                Answer your security question to reset your password.
            </div>

            <div class="security-question" id="security-question-display">
                Loading...
            </div>

            <form id="reset-form">
                <input type="hidden" id="reset-username" name="username">

                <div class="form-group">
                    <label class="form-label">Security Answer</label>
                    <input
                        type="text"
                        name="security_answer"
                        class="form-input"
                        placeholder="Enter your answer"
                        required
                    >
                </div>

                <div class="form-group">
                    <label class="form-label">New Password</label>
                    <input
                        type="password"
                        name="new_password"
                        class="form-input"
                        placeholder="Enter new password"
                        required
                        minlength="8"
                    >
                </div>

                <div class="form-group">
                    <label class="form-label">Confirm New Password</label>
                    <input
                        type="password"
                        name="confirm_password"
                        class="form-input"
                        placeholder="Confirm new password"
                        required
                    >
                </div>

                <button type="submit" class="btn btn-primary" id="reset-btn">
                    Reset Password
                </button>
            </form>
        </div>

        <div class="auth-footer">
            <a href="/auth/login">← Back to Login</a>
        </div>
    </div>

    <script>
        const alert = document.getElementById('alert');
        const step1 = document.getElementById('step1');
        const step2 = document.getElementById('step2');
        const usernameForm = document.getElementById('username-form');
        const resetForm = document.getElementById('reset-form');
        const usernameBtn = document.getElementById('username-btn');
        const resetBtn = document.getElementById('reset-btn');

        function showAlert(message, type = 'error') {
            alert.textContent = message;
            alert.className = `alert alert-${type} show`;
        }

        function hideAlert() {
            alert.className = 'alert';
        }

        // Step 1: Get security question
        usernameForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideAlert();

            const username = document.getElementById('username').value;

            usernameBtn.disabled = true;
            usernameBtn.textContent = 'Loading...';

            try {
                const response = await fetch('/auth/forgot-password/question', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username })
                });

                const result = await response.json();

                if (response.ok) {
                    // Show security question
                    document.getElementById('security-question-display').textContent = result.security_question;
                    document.getElementById('reset-username').value = username;

                    // Switch to step 2
                    step1.classList.remove('active');
                    step2.classList.add('active');
                } else {
                    showAlert(result.error || 'Username not found');
                    usernameBtn.disabled = false;
                    usernameBtn.textContent = 'Continue';
                }
            } catch (error) {
                console.error('Error:', error);
                showAlert('Network error. Please try again.');
                usernameBtn.disabled = false;
                usernameBtn.textContent = 'Continue';
            }
        });

        // Step 2: Reset password
        resetForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideAlert();

            const formData = new FormData(resetForm);

            // Validate passwords match
            if (formData.get('new_password') !== formData.get('confirm_password')) {
                showAlert('Passwords do not match');
                return;
            }

            const data = {
                username: formData.get('username'),
                security_answer: formData.get('security_answer'),
                new_password: formData.get('new_password')
            };

            resetBtn.disabled = true;
            resetBtn.textContent = 'Resetting...';

            try {
                const response = await fetch('/auth/reset-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (response.ok) {
                    showAlert('Password reset successfully! Redirecting to login...', 'success');

                    setTimeout(() => {
                        window.location.href = '/auth/login';
                    }, 2000);
                } else {
                    showAlert(result.error || 'Password reset failed. Please check your answer and try again.');
                    resetBtn.disabled = false;
                    resetBtn.textContent = 'Reset Password';
                }
            } catch (error) {
                console.error('Error:', error);
                showAlert('Network error. Please try again.');
                resetBtn.disabled = false;
                resetBtn.textContent = 'Reset Password';
            }
        });
    </script>
</body>
</html>
